name: Scheduled Check-In Bot

on:
  schedule:
    # 07:00 / 12:00 / 17:00 Central (CDT, UTC-5) - three runs/day for margin.
    # All well clear of 04:00-06:00 UTC, the midnight-Central danger zone
    # where a delayed run could slip into the next day's check-in window.
    - cron: "0 12,17,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run check-in bot
        env:
          PRACTICE_API_TOKEN: ${{ secrets.PRACTICE_API_TOKEN }}
          PRACTICE_API_URL: ${{ secrets.PRACTICE_API_URL }}
          INSTRUCTOR_ID: ${{ vars.INSTRUCTOR_ID }}
        run: python main.py

      - name: Commit artifact updates
        run: |
          git config user.name "checkin-bot"
          git config user.email "checkin-bot@users.noreply.github.com"
          git add artifact/
          git diff --staged --quiet || git commit -m "Automated artifact update"
          git push
